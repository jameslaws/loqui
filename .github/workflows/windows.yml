name: Windows

# Builds and checks Loqui for Windows on GitHub's own Windows computers, both
# the usual Intel/AMD kind and Arm. The repo is public, so these are free; full
# Windows runs never happen on the Mini.
on:
  push:
    # windows-version: the one branch the whole Windows version is built on.
    branches: [main, staging, windows-version]
    paths: ["windows/**", "shared/**", "PROJECT.md", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "shared/**", "PROJECT.md", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every change to windows/ that reaches staging becomes a test version, and
  # the number inside the app is the number on its release: so a pull request
  # that changes windows/ must raise windows/package.json's version.
  version:
    name: The Windows version goes up
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Higher than the version it merges into, when windows/ changed
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --quiet "origin/$BASE"...HEAD -- windows/; then
            echo "windows/ is unchanged."
          else
            node windows/scripts/release/version.mjs higher-than "origin/$BASE"
          fi

  # The welcome, settings and history screens in a browser against loqui's
  # stand-in: keyboard use, the accessibility scan, and every screen check.
  screens:
    name: Windows screens (in a browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: windows/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The browser the checks use
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: "WELC, SET, DICTN, HIST and A11Y-01: the screens, light and dark"
        run: pnpm test:screens

  windows:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (Intel/AMD)
            runner: windows-latest
            arch: x64
          - name: Windows (Arm)
            runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: This computer
        run: |
          [Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem).Caption
          "Architecture: $env:PROCESSOR_ARCHITECTURE"
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object -First 1
          "WebView2 runtime: $($wv.pv)"

      - name: Rust, pinned in rust-toolchain.toml
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $target = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$target/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain none --profile minimal --no-modify-path
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install
          rustc --version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: windows/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install
        run: pnpm install --frozen-lockfile

      # The engine and the 640 MB model come from their pinned sources and are
      # checked against their SHA-256 (scripts/fetch-speech.mjs); never from git.
      - name: Speech engine and model, cached between runs
        uses: actions/cache@v4
        with:
          path: windows/.speech-cache
          key: speech-${{ matrix.arch }}-${{ hashFiles('windows/scripts/fetch-speech.mjs') }}

      - name: Speech engine and model, checked against their SHA-256
        run: pnpm fetch:speech

      - name: Format and lint (TypeScript)
        run: pnpm exec biome ci .

      - name: Types
        run: pnpm exec tsc -p .

      - name: Format (Rust)
        run: cargo fmt --all --check

      - name: Lint (Rust)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p loqui --all-targets --features test-audio -- -D warnings

      # CLEAN-03 lists every shared example by id; CLEAN-05 loads the Mac's settings
      # files; REC-01 writes the history and stats lines the Mac's tests decode;
      # the screens' types in ui/src/bindings.ts must match the Rust.
      - name: "CLEAN-03, CLEAN-05 and REC-01: the Windows core passes every shared example and keeps the Mac's formats"
        run: cargo test -p loqui-core

      - name: "CLEAN-01, LOOK-01 and PLACE-01: the examples file, the look and the project record"
        run: pnpm exec vitest run --project contracts

      # Check builds: their update lists are on this computer (install/feed-server.mjs)
      # and their updates are signed with a key made for this run, so the update
      # checks need neither GitHub's lists nor loqui's real key. Real releases are
      # built by windows-release.yml.
      - name: A throwaway update key, and update lists on this computer
        run: |
          New-Item -ItemType Directory -Force target\check | Out-Null
          pnpm exec tauri signer generate --ci -f -w target\check\update.key | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pub = (Get-Content target\check\update.key.pub -Raw).Trim()
          @{ plugins = @{ updater = @{ pubkey = $pub; dangerousInsecureTransportProtocol = $true } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 target\check\tauri.check.json
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content target\check\update.key -Raw).Trim())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LOQUI_STABLE_FEED=http://127.0.0.1:8719/stable.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LOQUI_TEST_FEED=http://127.0.0.1:8719/beta.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the test installers (unsigned, with the speech model, and the update installer)
        id: build
        run: node scripts/release/build.mjs --config target\check\tauri.check.json

      - name: The release build has no test-only audio source
        run: |
          $exe = [IO.File]::ReadAllText("$pwd\target\release\loqui.exe", [Text.Encoding]::ASCII)
          if ($exe.Contains('LOQUI_TEST_AUDIO')) { throw 'the release build contains the test-only audio source' }
          Get-Content target\installers\loqui-*.json

      - name: The test build
        uses: actions/upload-artifact@v4
        with:
          name: loqui-test-build-${{ matrix.arch }}
          path: windows/target/installers/loqui-setup-*.exe
          if-no-files-found: error

      - name: "WINBASE: install, start, tray menu, About, quit"
        env:
          LOQUI_SHOTS: ${{ github.workspace }}\windows\target\shots
        run: pnpm test:acceptance

      - name: A microphone for the checks (VB-CABLE, pinned by SHA-256)
        if: matrix.arch == 'x64'
        run: ./e2e/setup-runner.ps1

      # GitHub's Arm computers have no virtual sound cable: DICT-07 runs a test
      # build that plays a file through the normal path instead.
      - name: The Arm test build with a file for a microphone (never shipped)
        if: matrix.arch == 'arm64'
        run: pnpm build:test-audio

      - name: "DICT, MIC, PASTE, HUD, PRIV, REC and PERF: real dictations into Notepad"
        env:
          LOQUI_SHOTS: ${{ github.workspace }}\windows\target\shots
        run: pnpm test:e2e

      # For reading when DICT-04 misses words: the same engine on the checks'
      # own recordings, straight from the files with no microphone in between.
      - name: "Diagnostics: the speech engine on the checks' recordings, from the files"
        if: (success() || failure()) && matrix.arch == 'x64'
        run: |
          foreach ($w in 'sentence', 'paragraph') {
            if (-not (Test-Path "target\e2e\$w.wav")) { "no $w recording: the dictation checks didn't get that far"; continue }
            cargo run --release -q -p loqui-speech --example transcribe -- src-tauri "target\e2e\$w.wav"
          }

      # Runs even when a dictation check failed, so one run reports on both parts.
      - name: "WELC, SET, HIST, RECENT and MENU on Windows: the real windows, light and dark"
        if: (success() || failure()) && matrix.arch == 'x64'
        env:
          LOQUI_SHOTS: ${{ github.workspace }}\windows\target\shots
        run: pnpm test:windows-screens

      # The next version, numbered one higher, as the update and install-over
      # checks need. Its full installer is left uncompressed: only the checks use it.
      - name: The next version, for the update and install checks
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          # The Arm dictation check leaves its test build running from target\release.
          Get-Process loqui -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          $next = "$($v[0]).$($v[1]).$([int]$v[2] + 1)"
          @{ version = $next; bundle = @{ windows = @{ nsis = @{ compression = 'none' } } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 target\check\next.json
          node scripts/release/build.mjs --out target\next-installers --config target\check\tauri.check.json --config target\check\next.json

      - name: "INST, UPD and CHAN-02: install, update itself, and uninstall"
        if: (success() || failure()) && steps.build.outcome == 'success'
        env:
          LOQUI_SHOTS: ${{ github.workspace }}\windows\target\shots
        run: pnpm test:install

      - name: Screenshots taken on this computer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.arch }}
          path: windows/target/shots
          if-no-files-found: warn

      - name: Leave the speech model out of the build cache
        if: always()
        run: Remove-Item -Recurse -Force target\release\engine, target\release\models, target\debug\engine, target\debug\models -ErrorAction SilentlyContinue
