<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Loqui dictation: mic-blocked</title>
<link rel="stylesheet" href="win.css">
<style>
  .np { left: 250px; top: 110px; width: 940px; height: 560px; background: var(--card); }
  .np .menubar { display: flex; gap: 18px; padding: 4px 14px 8px; font-size: 13px; }
  .np .page { flex: 1; padding: 14px 18px; font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 15px; line-height: 24px; border-top: 1px solid var(--stroke); }
  .np .status { height: 28px; border-top: 1px solid var(--stroke); font-size: 12px; display: flex; gap: 28px; align-items: center; padding: 0 14px; color: var(--muted); }
  .caret { display: inline-block; width: 1px; height: 18px; background: var(--text); vertical-align: -3px; }
  .hud { bottom: 92px; }
  .note { max-width: 520px; font-size: 14px; line-height: 20px; color: #FBF7F2; }
</style></head><body><div class="desk" data-tray="idle" data-apps="explorer,edge,notepad" data-on="notepad"><div class="win np">
    <div class="titlebar"><span>Notes for Friday.txt - Notepad</span><span class="grow"></span><span class="caps"><span>—</span><span>☐</span><span>✕</span></span></div>
    <div class="menubar"><span>File</span><span>Edit</span><span>View</span></div>
    <div class="page">Notes for the Friday call<br><br><span class="caret"></span></div>
    <div class="status"><span>Ln 3, Col 1</span><span>100%</span><span>Windows (CRLF)</span><span>UTF-8</span></div>
  </div><div class="hud"><span style="color:#E91E63;font-size:18px">⚠</span><span class="note">Windows is blocking the microphone. Turn on “Let desktop apps access your microphone” in Settings, then try again.</span></div></div><script src="scene.js"></script></body></html>
